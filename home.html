<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo UI Aplikasi Keuangan Complex</title>
  <style>
    :root {
      --primary: #3b82f6;
      --bg: #f8fafc;
      --text: #1e293b;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Frame Handphone */
    .phone-screen {
      width: 360px;
      height: 720px;
      background-color: #fff;
      border-radius: 40px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      position: relative;
      overflow: hidden;
      border: 10px solid #0f172a;
    }

    /* Notch HP */
    .notch {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 140px;
      height: 24px;
      background: #0f172a;
      border-bottom-left-radius: 16px;
      border-bottom-right-radius: 16px;
      z-index: 100;
    }

    /* Base Page */
    .page {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      padding: 40px 20px 20px 20px;
      display: flex;
      flex-direction: column;
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #page-dashboard { transform: translateX(0); }
    #page-form { transform: translateX(100%); background: #ffffff; }

    /* Header Balance */
    .balance-card {
      background: white;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      margin-bottom: 20px;
    }
    .balance-card .label { font-size: 13px; color: var(--text-muted); }
    .balance-card .amount { font-size: 30px; font-weight: 700; color: var(--text); margin-top: 4px; }

    /* Donut Chart SVG */
    .chart-section {
      background: white;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
    }

    .donut-chart {
      width: 140px;
      height: 140px;
      position: relative;
    }

    .donut-chart svg {
      transform: rotate(-90deg);
      border-radius: 50%;
    }

    .donut-chart circle {
      fill: none;
      stroke-width: 12;
      stroke-dasharray: 283; /* 2 * PI * r (r=45) */
      stroke-dashoffset: 283;
      transition: stroke-dashoffset 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .donut-bg { stroke: #f1f5f9; stroke-dashoffset: 0 !important; }
    .donut-segment { stroke: var(--primary); }

    .chart-center-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }
    .chart-center-text span { display: block; font-size: 11px; color: var(--text-muted); }
    .chart-center-text strong { font-size: 16px; color: var(--text); }

    /* List Items */
    .item-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: white;
      padding: 12px 16px;
      border-radius: 14px;
    }

    .item-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: #eff6ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: var(--primary);
    }

    /* Form & Keypad */
    .amount-display {
      font-size: 36px;
      font-weight: 700;
      text-align: center;
      margin: 20px 0;
      color: var(--primary);
      min-height: 50px;
    }

    .form-field {
      background: #f1f5f9;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 10px;
      font-size: 14px;
      color: var(--text);
      display: flex;
      justify-content: space-between;
    }

    /* Keypad Grid */
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: auto;
      margin-bottom: 10px;
    }

    .key-btn {
      background: #f8fafc;
      border: none;
      padding: 16px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      text-align: center;
    }

    .key-btn:active { background: #e2e8f0; }

    /* Modal Pop-up / Bottom Sheet */
    .modal {
      position: absolute;
      bottom: -100%;
      left: 0;
      width: 100%;
      background: white;
      border-radius: 24px 24px 0 0;
      padding: 24px;
      box-shadow: 0 -10px 30px rgba(0,0,0,0.15);
      transition: bottom 0.4s ease-out;
      z-index: 50;
    }

    .modal.show { bottom: 0; }

    /* Time Picker Analog */
    .clock-face {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: #f1f5f9;
      margin: 20px auto;
      position: relative;
    }

    .hand {
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform-origin: bottom center;
      background: var(--primary);
      border-radius: 4px;
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .hour-hand { width: 4px; height: 45px; }
    .minute-hand { width: 2px; height: 65px; background: #f43f5e; }

    /* Date Grid */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      text-align: center;
      font-size: 12px;
      margin-top: 15px;
    }

    .day { padding: 8px; border-radius: 8px; }
    .day.active { background: var(--primary); color: white; font-weight: bold; }

    .btn-action {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="phone-screen">
    <div class="notch"></div>

    <div class="page" id="page-dashboard">
      <div style="display:flex; justify-between; align-items:center; margin-bottom: 15px;">
        <h2 style="font-size: 20px;">Laporan Ringkas</h2>
      </div>

      <div class="balance-card">
        <div class="label">Total Saldo</div>
        <div class="amount">$50,000.00</div>
      </div>

      <div class="chart-section">
        <div class="donut-chart">
          <svg width="140" height="140" viewBox="0 0 100 100">
            <circle class="donut-bg" cx="50" cy="50" r="45"></circle>
            <circle class="donut-segment" id="donut-circle" cx="50" cy="50" r="45"></circle>
          </svg>
          <div class="chart-center-text">
            <span>Pengeluaran</span>
            <strong>65%</strong>
          </div>
        </div>
      </div>

      <div class="item-list">
        <div class="item">
          <div style="display:flex; gap:12px; align-items:center;">
            <div class="item-icon">🛒</div>
            <div>
              <strong style="font-size:14px;">Belanja Bulanan</strong>
              <div style="font-size:11px; color:var(--text-muted);">14 April 2026</div>
            </div>
          </div>
          <span style="font-weight:bold; font-size:14px;">-$450.50</span>
        </div>
      </div>
    </div>

    <div class="page" id="page-form">
      <h3 style="font-size: 18px;">Tambah Transaksi</h3>

      <div class="amount-display" id="display-amount">$0</div>

      <div class="form-field" id="field-category">
        <span style="color:var(--text-muted);">Kategori</span>
        <strong id="val-category">Pilih...</strong>
      </div>

      <div class="form-field">
        <span style="color:var(--text-muted);">Tanggal</span>
        <strong id="val-date">16 Juni 2026</strong>
      </div>

      <div class="form-field">
        <span style="color:var(--text-muted);">Waktu</span>
        <strong id="val-time">09:00 AM</strong>
      </div>

      <div class="keypad">
        <div class="key-btn" data-key="1">1</div>
        <div class="key-btn" data-key="2">2</div>
        <div class="key-btn" data-key="3">3</div>
        <div class="key-btn" data-key="4">4</div>
        <div class="key-btn" data-key="5">5</div>
        <div class="key-btn" data-key="6">6</div>
        <div class="key-btn" data-key="7">7</div>
        <div class="key-btn" data-key="8">8</div>
        <div class="key-btn" data-key="9">9</div>
        <div class="key-btn">.</div>
        <div class="key-btn" data-key="0">0</div>
        <div class="key-btn">⌫</div>
      </div>

      <button class="btn-action">Simpan Transaksi</button>
    </div>

    <div class="modal" id="modal-calendar">
      <h4 style="text-align:center;">Pilih Tanggal</h4>
      <div class="calendar-grid">
        <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
        <div>12</div><div>13</div><div>14</div><div>15</div>
        <div class="day" id="date-target">16</div>
        <div class="day active" id="date-selected">17</div>
        <div>18</div>
      </div>
    </div>

    <div class="modal" id="modal-time">
      <h4 style="text-align:center;">Setel Jam</h4>
      <div class="clock-face">
        <div class="hand hour-hand" id="hour-hand"></div>
        <div class="minute-hand hand" id="minute-hand"></div>
      </div>
      <button class="btn-action" id="btn-set-time">Pilih Waktu</button>
    </div>

  </div>

  <script>
    const delay = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    // Elements
    const pageDashboard = document.getElementById('page-dashboard');
    const pageForm = document.getElementById('page-form');
    const donutCircle = document.getElementById('donut-circle');
    const displayAmount = document.getElementById('display-amount');
    const modalCalendar = document.getElementById('modal-calendar');
    const modalTime = document.getElementById('modal-time');
    const hourHand = document.getElementById('hour-hand');
    const minuteHand = document.getElementById('minute-hand');
    const valCategory = document.getElementById('val-category');
    const valDate = document.getElementById('val-date');
    const valTime = document.getElementById('val-time');
    const dateSelected = document.getElementById('date-selected');
    const dateTarget = document.getElementById('date-target');

    async function runComplexDemo() {
      await delay(600);

      // 1. Animasi Donut Chart SVG (Melingkar)
      // 283 = full length. 65% pengeluaran -> stroke-dashoffset = 283 * (1 - 0.65) = ~99
      donutCircle.style.strokeDashoffset = '99';

      await delay(1800);

      // 2. Transisi Pindah Halaman ke Form (Slide Left)
      pageDashboard.style.transform = 'translateX(-100%)';
      pageForm.style.transform = 'translateX(0)';

      await delay(800);

      // 3. Simulasi Pengetikan Angka lewat Keypad ($135)
      const keys = ['1', '3', '5'];
      let currentVal = '';

      for (let key of keys) {
        currentVal += key;
        displayAmount.innerText = `$${currentVal}`;
        
        // Visual feedback tombol ditekan
        const btn = document.querySelector(`.key-btn[data-key="${key}"]`);
        if(btn) {
          btn.style.background = '#e2e8f0';
          setTimeout(() => btn.style.background = '#f8fafc', 150);
        }
        await delay(250);
      }

      await delay(600);
      valCategory.innerText = 'Makanan & Minuman';

      await delay(800);

      // 4. Buka Modal Kalender (Date Picker)
      modalCalendar.classList.add('show');
      await delay(1000);

      // Simulasi Pilih Tanggal 16
      dateSelected.classList.remove('active');
      dateTarget.classList.add('active');
      valDate.innerText = '16 Juni 2026';

      await delay(800);
      modalCalendar.classList.remove('show');

      await delay(600);

      // 5. Buka Modal Time Picker (Jam Analog)
      modalTime.classList.add('show');
      await delay(600);

      // Putar Jarum Jam Ke Jam 04:25
      // 4 Jam = (4 / 12) * 360 deg = 120 deg
      // 25 Menit = (25 / 60) * 360 deg = 150 deg
      hourHand.style.transform = 'rotate(120deg)';
      minuteHand.style.transform = 'rotate(150deg)';

      await delay(1200);
      valTime.innerText = '04:25 PM';
      modalTime.classList.remove('show');

      await delay(1000);

      // 6. Selesai - Kembali ke Dashboard
      pageDashboard.style.transform = 'translateX(0)';
      pageForm.style.transform = 'translateX(100%)';
    }

    // Jalankan Otomatis
    window.addEventListener('DOMContentLoaded', runComplexDemo);
  </script>
</body>
</html>
