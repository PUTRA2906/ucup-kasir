<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer di Bangorejo - Ucup Kasir</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-outfit { font-family: 'Outfit', sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#0b1222] text-slate-100 min-h-screen pb-28 select-none">

  <!-- ================= CONTAINER UTAMA ================= -->
  <main class="p-4 max-w-md mx-auto space-y-4 pt-5">

    <!-- 1. HEADER JUDUL & TOMBOL KEMBALI -->
    <section class="space-y-1">
      <div class="flex items-center gap-2.5">
        <button onclick="history.back()" class="p-2 rounded-xl bg-[#141f36] text-slate-300 hover:text-white border border-slate-800 active:scale-95 transition">
          <i data-lucide="arrow-left" class="w-4 h-4"></i>
        </button>
        <div>
          <h1 class="text-xl font-extrabold font-outfit text-white tracking-tight leading-tight">
            Customer di Bangorejo
          </h1>
          <p class="text-[11px] text-slate-400">Pilih mitra untuk melihat riwayat invoice & piutang</p>
        </div>
      </div>
    </section>

    <!-- 2. SEARCH BAR -->
    <div class="relative">
      <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
      <input 
        id="customerSearch"
        type="text" 
        onkeyup="filterCustomers()"
        placeholder="Cari nama kios, pemilik, no. telepon..." 
        class="w-full bg-[#141f36] border border-slate-800/90 rounded-2xl pl-10 pr-4 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 shadow-inner"
      />
    </div>

    <!-- 3. FILTER CHIP HORIZONTAL (PENGGANTI DROPDOWN TEBAL) -->
    <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar text-xs">
      <button onclick="setFilter('all')" class="filter-btn px-3.5 py-1.5 rounded-xl bg-blue-600 text-white font-semibold whitespace-nowrap shadow-sm">
        Semua (3)
      </button>
      <button onclick="setFilter('debt')" class="filter-btn px-3.5 py-1.5 rounded-xl bg-[#141f36] text-rose-400 border border-rose-500/20 whitespace-nowrap">
        Ada Piutang (1)
      </button>
      <button onclick="setFilter('top')" class="filter-btn px-3.5 py-1.5 rounded-xl bg-[#141f36] text-slate-400 border border-slate-800 whitespace-nowrap">
        Invoice Terbanyak
      </button>
    </div>

    <!-- 4. LIST CARD CUSTOMER -->
    <section id="customerList" class="space-y-3">

      <!-- Customer 1: Agus Santoso (Ada Piutang & 10 Invoice) -->
      <div class="customer-card bg-[#141f36] rounded-2xl border border-slate-800/80 p-3.5 space-y-3 shadow-md">
        <div class="flex justify-between items-start">
          <div class="space-y-0.5">
            <h2 class="customer-name text-sm font-bold font-outfit text-white">Agus Santoso</h2>
            <p class="customer-store text-xs text-slate-300 font-medium">Toko Bango</p>
            <p class="customer-phone text-[11px] text-slate-400 font-mono">081234567801</p>
          </div>
          <!-- Badge Piutang -->
          <span class="px-2.5 py-1 rounded-lg bg-rose-500/15 text-rose-400 border border-rose-500/30 text-[10px] font-bold font-outfit">
            Sisa: Rp 133.334
          </span>
        </div>

        <!-- Footer Card: Counter Invoice + Quick Actions -->
        <div class="flex items-center justify-between pt-2 border-t border-slate-800/60 text-xs">
          <button onclick="goTo('/invoices/agus', 'Daftar Invoice Agus')" class="text-[11px] font-semibold text-blue-400 bg-blue-500/10 px-2.5 py-1 rounded-lg border border-blue-500/20 hover:bg-blue-500/20 active:scale-95 transition">
            10 Invoice
          </button>
          
          <div class="flex items-center gap-2">
            <a href="https://wa.me/6281234567801" target="_blank" class="p-2 rounded-xl bg-emerald-600/15 text-emerald-400 border border-emerald-500/30 active:scale-95 transition flex items-center justify-center">
              <i data-lucide="message-circle" class="w-4 h-4"></i>
            </a>
            <button onclick="goTo('/transactions/add?customer=agus', 'Faktur Baru')" class="px-3 py-1.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold font-outfit text-[11px] flex items-center gap-1 shadow-md shadow-blue-600/20 active:scale-95 transition">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i>
              <span>Buat Nota</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Customer 2: Fathur Rahman (Lunas & 0 Invoice) -->
      <div class="customer-card bg-[#141f36] rounded-2xl border border-slate-800/80 p-3.5 space-y-3 shadow-md">
        <div class="flex justify-between items-start">
          <div class="space-y-0.5">
            <h2 class="customer-name text-sm font-bold font-outfit text-white">Fathur Rahman</h2>
            <p class="customer-store text-xs text-slate-300 font-medium">UD Tani Barokah 2</p>
            <p class="customer-phone text-[11px] text-slate-400 font-mono">081356789027</p>
          </div>
          <!-- Badge Status Lunas -->
          <span class="px-2.5 py-1 rounded-lg bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-[10px] font-bold font-outfit">
            Lunas
          </span>
        </div>

        <div class="flex items-center justify-between pt-2 border-t border-slate-800/60 text-xs">
          <span class="text-[11px] font-medium text-slate-400 bg-slate-800/60 px-2.5 py-1 rounded-lg">
            0 Invoice
          </span>
          
          <div class="flex items-center gap-2">
            <a href="https://wa.me/6281356789027" target="_blank" class="p-2 rounded-xl bg-emerald-600/15 text-emerald-400 border border-emerald-500/30 active:scale-95 transition flex items-center justify-center">
              <i data-lucide="message-circle" class="w-4 h-4"></i>
            </a>
            <button onclick="goTo('/transactions/add?customer=fathur', 'Faktur Baru')" class="px-3 py-1.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold font-outfit text-[11px] flex items-center gap-1 shadow-md shadow-blue-600/20 active:scale-95 transition">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i>
              <span>Buat Nota</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Customer 3: Budi Santoso (Lunas & 0 Invoice) -->
      <div class="customer-card bg-[#141f36] rounded-2xl border border-slate-800/80 p-3.5 space-y-3 shadow-md">
        <div class="flex justify-between items-start">
          <div class="space-y-0.5">
            <h2 class="customer-name text-sm font-bold font-outfit text-white">Budi Santoso</h2>
            <p class="customer-store text-xs text-slate-300 font-medium">Kios Tani Subur</p>
            <p class="customer-phone text-[11px] text-slate-400 font-mono">081298765432</p>
          </div>
          <span class="px-2.5 py-1 rounded-lg bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-[10px] font-bold font-outfit">
            Lunas
          </span>
        </div>

        <div class="flex items-center justify-between pt-2 border-t border-slate-800/60 text-xs">
          <span class="text-[11px] font-medium text-slate-400 bg-slate-800/60 px-2.5 py-1 rounded-lg">
            0 Invoice
          </span>
          
          <div class="flex items-center gap-2">
            <a href="https://wa.me/6281298765432" target="_blank" class="p-2 rounded-xl bg-emerald-600/15 text-emerald-400 border border-emerald-500/30 active:scale-95 transition flex items-center justify-center">
              <i data-lucide="message-circle" class="w-4 h-4"></i>
            </a>
            <button onclick="goTo('/transactions/add?customer=budi', 'Faktur Baru')" class="px-3 py-1.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold font-outfit text-[11px] flex items-center gap-1 shadow-md shadow-blue-600/20 active:scale-95 transition">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i>
              <span>Buat Nota</span>
            </button>
          </div>
        </div>
      </div>

    </section>

  </main>

  <!-- ================= BOTTOM NAVIGATION BAR ================= -->
  <nav class="fixed bottom-0 left-0 right-0 z-50 bg-[#0d1527]/95 backdrop-blur-md border-t border-slate-800/80 h-16 flex items-center justify-around px-2 max-w-md mx-auto">
    
    <!-- 1. Home -->
    <button onclick="goTo('/', 'Home')" class="flex flex-col items-center justify-center flex-1 py-1 text-slate-400 hover:text-white">
      <i data-lucide="home" class="w-5 h-5"></i>
      <span class="text-[10px] mt-1 font-outfit">Home</span>
    </button>

    <!-- 2. Kios (Aktif) -->
    <button class="flex flex-col items-center justify-center flex-1 py-1 text-blue-500 font-semibold">
      <i data-lucide="store" class="w-5 h-5"></i>
      <span class="text-[10px] mt-1 font-outfit">Kios</span>
    </button>

    <!-- 3. Tambah Transaksi (Floating Button di Tengah) -->
    <button onclick="goTo('/transactions/add', 'Tambah Transaksi')" class="flex flex-col items-center justify-center flex-1 py-1 -mt-5 group">
      <div class="w-12 h-12 rounded-full bg-blue-600 text-white flex items-center justify-center shadow-lg shadow-blue-600/40 border-4 border-[#0b1222] group-hover:scale-105 transition-transform">
        <i data-lucide="plus" class="w-6 h-6"></i>
      </div>
      <span class="text-[10px] mt-0.5 font-outfit text-slate-300 font-medium">Transaksi</span>
    </button>

    <!-- 4. Stok -->
    <button onclick="goTo('/products', 'Stok')" class="flex flex-col items-center justify-center flex-1 py-1 text-slate-400 hover:text-white">
      <i data-lucide="boxes" class="w-5 h-5"></i>
      <span class="text-[10px] mt-1 font-outfit">Stok</span>
    </button>

    <!-- 5. Pengaturan -->
    <button onclick="goTo('/settings', 'Pengaturan')" class="flex flex-col items-center justify-center flex-1 py-1 text-slate-400 hover:text-white">
      <i data-lucide="settings" class="w-5 h-5"></i>
      <span class="text-[10px] mt-1 font-outfit">Pengaturan</span>
    </button>

  </nav>

  <!-- ================= LOGIKA JAVASCRIPT ================= -->
  <script>
    function filterCustomers() {
      const query = document.getElementById('customerSearch').value.toLowerCase();
      const cards = document.querySelectorAll('.customer-card');

      cards.forEach(card => {
        const name = card.querySelector('.customer-name').innerText.toLowerCase();
        const store = card.querySelector('.customer-store').innerText.toLowerCase();
        const phone = card.querySelector('.customer-phone').innerText.toLowerCase();

        if (name.includes(query) || store.includes(query) || phone.includes(query)) {
          card.classList.remove('hidden');
        } else {
          card.classList.add('hidden');
        }
      });
    }

    function setFilter(type) {
      alert(`Menerapkan filter: ${type}`);
    }

    function goTo(path, title) {
      alert(`Navigasi ke: ${title} (${path})`);
    }

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });
  </script>
</body>
</html>
