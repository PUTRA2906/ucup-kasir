name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Create .env file
      run: |
        echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" > .env
        echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env

    - name: Build Vue app
      run: npm run build

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Make gradlew executable
      run: chmod +x android/gradlew

    - name: Setup Release Signing
      # Dekripsi keystore dari GitHub Secrets & buat keystore.properties
      # agar setiap build memakai signature yang sama (update tanpa uninstall)
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
          echo "::warning::ANDROID_KEYSTORE_BASE64 kosong — APK akan ditandatangani debug keystore (perlu uninstall saat update)."
          exit 0
        fi
        # Pakai Python agar tahan banting terhadap newline/spasi di secret
        python3 - "$ANDROID_KEYSTORE_BASE64" <<'PY'
        import sys, base64
        raw = sys.argv[1].strip()
        print(f"Jumlah karakter base64 yang diterima: {len(raw)}")
        data = base64.b64decode(raw)
        print(f"Keystore berhasil didekripsi: {len(data)} bytes")
        with open("android/ucup-kasir-release.keystore", "wb") as f:
            f.write(data)
        PY
        cat > android/keystore.properties <<EOF
        storeFile=ucup-kasir-release.keystore
        storePassword=$KEYSTORE_PASSWORD
        keyAlias=$KEY_ALIAS
        keyPassword=$KEY_PASSWORD
        EOF

    - name: Build APK (Release)
      run: |
        cd android
        ./gradlew assembleRelease --no-daemon --stacktrace

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: ucup-kasir-release
        path: android/app/build/outputs/apk/release/app-release.apk
        retention-days: 30
